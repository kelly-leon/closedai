services:
  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://closedai:closedai@postgres:5432/closedai
    ports:
      - "8000:8000"
    volumes:
      - uploaded-files:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: closedai
      POSTGRES_USER: closedai
      POSTGRES_PASSWORD: closedai
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U closedai -d closedai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  uploaded-files:
